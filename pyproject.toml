[project]
name = "QuickeR-Web"
version = "1.2"
license = { text = "MIT" }
description = ""
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Unax Martinez Llorente (ChoiceZero)", email = "unaxmarti2009@gmail.com" }
]
dependencies = [
    "flet>=0.85.2",
    "flet_color_pickers>=0.85.2",
    "Pillow>=12.2.0",
    "qrcode>=8.2"
]

[dependency-groups]
dev = [
    "flet-cli>=0.85.2",
    "flet-desktop>=0.85.2",
    "flet-web>=0.85.2",
    #"watchdog>=4.0.0"
]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
product = "quicker-web"
company = "Unax Martinez Llorente"
copyright = "MIT License"

[tool.flet.app]
path = "src"

[tool.flet.package]
exclude = [
    ".venv",          
    "venv",
    ".flet",
    "__pycache__",    
    "*.pyc", 
    "README.md",
    ".gitignore",   
    ".git",         
]